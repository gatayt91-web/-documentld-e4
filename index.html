<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- 1. NOMBRE DE LA PESTA (al pasar el mouse encima de la pestaña del navegador) -->
  <title>Portal Incapacidades/title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf_viewer.min.css">

  <style>
    :root {
      --fondo-pagina: #f1f3f5;
      --fondo-pdf: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100dvh;
      background-color: var(--fondo-pagina);
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 56px 16px 24px;
    }

    #aviso-global {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 20;
      background-color: #1f2937;
      color: #ffffff;
      padding: 8px 16px;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      border-bottom: 1px solid #374151;
    }

    .visor-pdf {
      background-color: var(--fondo-pdf);
      border-radius: 14px;
      box-shadow: 0 2px 14px rgba(0, 0, 0, 0.04);
      width: 100%;
      max-width: 460px;
      margin: 0 auto;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .pagina-contenedor {
      position: relative;
      width: 100%;
      background-color: var(--fondo-pdf);
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      background-color: var(--fondo-pdf);
    }

    .textLayer {
      opacity: 1;
    }

    .textLayer ::selection {
      background: rgba(0, 123, 255, 0.3);
    }

    @media (max-width: 600px) {
      body {
        justify-content: flex-start;
        padding: 72px 12px 20px;
      }

      .visor-pdf {
        max-width: 100%;
        border-radius: 12px;
      }
    }
  </style>
</head>

<body>
  <div id="aviso-global">
    <span id="aviso-texto"></span>
  </div>

  <!-- 2. TEXTO FLOTANTE AL PASAR LA FLECHA SOBRE LA TARJETA -->
  <div class="visor-pdf" id="visor-pdf" title="PON AQUI EL NOMBRE FLOTANTE DE LA TARJETA"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <script>
    const urlPdf = 'imagen.pdf';
    const urlAviso = './aviso.json';

    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const contenedorPrincipal = document.getElementById('visor-pdf');
    const bannerAviso = document.getElementById('aviso-global');
    const textoAviso = document.getElementById('aviso-texto');

    async function cargarAviso() {
      try {
        const res = await fetch(`${urlAviso}?t=${Date.now()}`, {
          cache: 'no-store'
        });

        if (!res.ok) return;

        const data = await res.json();

        if (data.activo && data.texto && data.texto.trim() !== '') {
          textoAviso.textContent = data.texto;
          bannerAviso.style.display = 'block';
        }
      } catch (_) {}
    }

    async function renderizarPDF() {
      const pdf = await pdfjsLib.getDocument(`${urlPdf}?t=${Date.now()}`).promise;
      const pagina = await pdf.getPage(1);
      const viewportOriginal = pagina.getViewport({ scale: 2 });

      const divPagina = document.createElement('div');
      divPagina.className = 'pagina-contenedor';
      contenedorPrincipal.appendChild(divPagina);

      const canvas = document.createElement('canvas');
      const contexto = canvas.getContext('2d');

      canvas.width = viewportOriginal.width;
      canvas.height = viewportOriginal.height;

      divPagina.appendChild(canvas);

      await pagina.render({
        canvasContext: contexto,
        viewport: viewportOriginal
      }).promise;

      const divTexto = document.createElement('div');
      divTexto.className = 'textLayer';
      divPagina.appendChild(divTexto);

      const actualizarCapaTexto = async () => {
        divTexto.innerHTML = '';

        const escalaPantalla = canvas.clientWidth / viewportOriginal.width;
        const viewportTexto = pagina.getViewport({
          scale: 2 * escalaPantalla
        });

        divTexto.style.setProperty('--scale-factor', 2 * escalaPantalla);

        const contenidoTexto = await pagina.getTextContent();

        pdfjsLib.renderTextLayer({
          textContentSource: contenidoTexto,
          container: divTexto,
          viewport: viewportTexto,
          textDivs: []
        });
      };

      await actualizarCapaTexto();
      window.addEventListener('resize', actualizarCapaTexto);
    }

    cargarAviso();

    renderizarPDF().catch(() => {
      contenedorPrincipal.innerHTML =
        '<p style="padding:20px;color:#b00;">No se pudo cargar imagen.pdf.</p>';
    });
  </script>
</body>
</html>
